name: Release

# A tag v<version> that matches package.json releases that version:
#
#   1. test: the type check and the tests, in a job that can sign nothing and
#      publish nothing, because the test tools are third-party code;
#   2. build: the tarball, from the checkout and Node.js alone (no package is
#      installed in this job), built twice to prove it is reproducible, and a
#      build attestation (Sigstore, SLSA provenance) for it;
#   3. npm: the same tarball published with provenance, through npm trusted
#      publishing (OIDC: no npm token exists anywhere), from the protected
#      environment "npm", which needs a maintainer's approval;
#   4. github: a GitHub Release with the tarball, its SHA-256 checksum and the
#      attestation bundle.
#
# Each job holds only the permissions it needs. Every action is pinned by
# commit. Nothing runs an install script: every npm ci has --ignore-scripts,
# and the published package has no scripts at all.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The exact Node.js version the tarball is built with: the build is
  # reproducible with the same version. Its npm must be 11.5.1 or newer for
  # trusted publishing.
  NODE_VERSION: 24.19.0

jobs:
  test:
    name: Tests and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Read-only: the test tools (vitest, TypeScript, PGlite, fast-check and
    # what they pull in) run here and nowhere else, so a compromised one
    # cannot change the sources the build job packs or sign anything.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the PostgreSQL client and the test tools
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm ci --ignore-scripts --no-fund --no-audit --prefix test

      - name: Type check and test
        working-directory: test
        run: |
          npm run typecheck
          npm test

  build:
    name: Build and attest
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No npm install and no test run in this job: it holds the signing
    # identity, so it runs the checkout, Node.js and scripts/build.ts only.
    permissions:
      contents: read
      id-token: write # the attestation's Sigstore certificate
      attestations: write # store the attestation with this repository
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The tag is the version in package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, twice, and compare
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node --disable-warning=ExperimentalWarning scripts/build.ts --out dist
          node --disable-warning=ExperimentalWarning scripts/build.ts --out "$RUNNER_TEMP/again"
          cmp "dist/maplith-bridge-$VERSION.tgz" "$RUNNER_TEMP/again/maplith-bridge-$VERSION.tgz"
          (cd dist && sha256sum -c "maplith-bridge-$VERSION.tgz.sha256")
          # The published manifest runs nothing.
          tar -xzOf "dist/maplith-bridge-$VERSION.tgz" package/package.json | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (m.scripts !== undefined) { console.error("the published package.json has scripts"); process.exit(1); }
          '
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH, Node.js $(node --version)"

      - name: Attest the build
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/maplith-bridge-${{ steps.version.outputs.version }}.tgz

      - name: Keep the attestation bundle beside the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: cp "$BUNDLE" "dist/maplith-bridge-$VERSION.tgz.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Publish the tarball that was built and attested
        working-directory: dist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum -c "maplith-bridge-$VERSION.tgz.sha256"
          npm_version="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error(`npm ${process.argv[1]} is too old for trusted publishing (11.5.1 or newer)`); process.exit(1); }
          ' "$npm_version"
          case "$VERSION" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish "./maplith-bridge-$VERSION.tgz" --access public --provenance --tag "$tag"

  github:
    name: GitHub Release
    needs: [build, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The notes: this version's section of CHANGELOG.md, then how to verify it.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Verify"
            echo
            echo '```sh'
            echo "sha256sum -c maplith-bridge-$VERSION.tgz.sha256"
            echo "gh attestation verify maplith-bridge-$VERSION.tgz --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "dist/maplith-bridge-$VERSION.tgz.sha256")\`. Built with Node.js $NODE_VERSION; reproduce with \`SOURCE_DATE_EPOCH=\$(git log -1 --format=%ct $TAG) node scripts/build.ts\`."
            echo
            echo "npm: \`npx --yes maplith-bridge@$VERSION --help\`"
          } >> notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            "dist/maplith-bridge-$VERSION.tgz" \
            "dist/maplith-bridge-$VERSION.tgz.sha256" \
            "dist/maplith-bridge-$VERSION.tgz.sigstore.json" \
            --verify-tag --title "Maplith Bridge $VERSION" --notes-file notes.md $prerelease
